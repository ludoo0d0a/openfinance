name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: production
        type: choice
        options: [production, preview]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  verify:
    name: Verify before deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VITE_ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
      VITE_ADSENSE_SLOT: ${{ vars.ADSENSE_SLOT }}
      VITE_ADSENSE_SLOT_INTRO: ${{ vars.ADSENSE_SLOT_INTRO }}
      VITE_ADSENSE_SLOT_MID: ${{ vars.ADSENSE_SLOT_MID }}
      VITE_ADSENSE_SLOT_END: ${{ vars.ADSENSE_SLOT_END }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist
          retention-days: 1

  deploy:
    name: Cloudflare Pages
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ inputs.environment || 'production' }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=openfinance
            --branch=${{ github.ref_name }}
            --commit-hash=${{ github.sha }}
            --commit-dirty=true

      - name: Smoke test the deployment
        run: |
          URL="${{ steps.deploy.outputs.deployment-url }}"
          echo "Checking $URL"
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL" || true)
            [ "$code" = "200" ] && break
            echo "attempt $i returned $code, retrying"
            sleep 6
          done
          [ "$code" = "200" ] || { echo "Site did not come up (last status $code)"; exit 1; }

          catalog=$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/catalog" || true)
          [ "$catalog" = "200" ] || { echo "Catalog function returned $catalog"; exit 1; }

          # Deep-link refresh must serve the SPA shell (not a bare 404).
          deep=$(curl -s -o /dev/null -w '%{http_code}' "$URL/flows/sct-inst-happy-path" || true)
          [ "$deep" = "200" ] || { echo "SPA deep link returned $deep"; exit 1; }

          if [ -n "${{ vars.ADSENSE_CLIENT }}" ]; then
            ads=$(curl -s -o /dev/null -w '%{http_code}' "$URL/ads.txt" || true)
            [ "$ads" = "200" ] || { echo "ads.txt returned $ads"; exit 1; }
          fi
          echo "Deployment healthy."
